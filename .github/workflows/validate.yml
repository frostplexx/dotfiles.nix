name: "Nix Configuration Validation"

# Builds run on pull requests only. A merge to main re-runs the exact tree the
# PR run just built, and Cachix already holds those paths, so the push trigger
# only repeats work. Lint and the formatting check still run on main.
on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - ".harper-dictionary.txt"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run in flight. Without this,
# back-to-back Renovate pushes left 30-45 minute builds running in parallel.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-check:
    name: GitGuardian Security Scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: GitGuardian scan
        uses: GitGuardian/ggshield/actions/secret@v1.57.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  lint:
    name: Statix Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          push: "false"
      - name: Run statix and deadnix
        run: |
          nix shell nixpkgs#statix nixpkgs#deadnix --command bash -c '
            statix check .
            deadnix -eq .
          '

  detect-configs:
    name: Detect Configurations
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          push: "false"
      - name: Generate Configuration Matrix
        id: set-matrix
        shell: bash
        run: |
          MATRIX_JSON='{"include":['
          for config in $(nix eval --impure --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            MATRIX_JSON+="{\"name\":\"$config\",\"os\":\"ubuntu-latest\",\"type\":\"nixos\"},"
          done
          for config in $(nix eval --impure --json .#darwinConfigurations --apply builtins.attrNames 2>/dev/null | jq -r '.[]'); do
            MATRIX_JSON+="{\"name\":\"$config\",\"os\":\"macos-latest\",\"type\":\"darwin\"},"
          done
          MATRIX_JSON=${MATRIX_JSON%,}
          MATRIX_JSON+="]}"
          echo "Matrix: $MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  # Kept as its own job so the required-check name stays stable. The only flake
  # check is the alejandra formatting check, so this is one cheap Linux job.
  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          sops-age-key: ${{ secrets.SOPS_AGE_KEY }}
      - run: nix flake check

  test-configurations:
    name: Test Nix Configurations (matrix)
    if: github.event_name != 'push'
    needs: [detect-configs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Post build result comments on the PR, so this job needs issues: write
    # (GitHub routes PR comments through the issues API). Fork PRs still get a
    # read-only token; the comment step must tolerate that.
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-configs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          sops-age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Build Configuration
        id: build
        run: |
          # Cachix pushes the final paths through its post-build hook. The
          # intermediate-derivation push lives in the push-cache job, so pull
          # requests stay fast.
          nix shell nixpkgs#nix-fast-build nixpkgs#nix-eval-jobs --command \
            nix-fast-build \
              --flake .#ciTargets \
              --no-nom \
              --skip-cached \
              2>&1 | tee build-output.txt
          exit "${PIPESTATUS[0]}"

      # Fork PRs get a read-only token, so commenting fails with 403. Skip them
      # and let the job status carry the result.
      - name: Post build result
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const outcome = '${{ steps.build.outcome }}';
            const name = '${{ matrix.name }}';
            const type = '${{ matrix.type }}';
            const output = fs.existsSync('build-output.txt')
              ? fs.readFileSync('build-output.txt', 'utf8').trim()
              : '(no output)';
            const icon = outcome === 'success' ? '✅' : '❌';
            const fingerprint = `<!-- build: ${name} (${type}) -->`;
            const body = [
              fingerprint,
              `## ${icon} Build \`${name}\` (${type}) — ${outcome}`,
              '',
              '<details>',
              outcome === 'success'
                ? '<summary>Build succeeded</summary>'
                : '<summary>Build errors — click to expand</summary>',
              '',
              '```',
              output.slice(0, 65000),
              '```',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body?.includes(fingerprint));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if build failed
        if: always() && steps.build.outcome == 'failure'
        run: exit 1

  # Runs after every merge, so Cachix holds main's paths even when the pull
  # request had no cache token (forks) or its run was cancelled. --skip-cached
  # keeps this to the misses when the pull request already pushed everything.
  push-cache:
    name: Update Cachix cache
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          sops-age-key: ${{ secrets.SOPS_AGE_KEY }}
      - name: Build and push what the cache is missing
        run: |
          nix shell nixpkgs#nix-fast-build nixpkgs#nix-eval-jobs --command \
            nix-fast-build \
              --flake .#ciTargets \
              --no-nom \
              --skip-cached \
              --cachix-cache frostplexx \
              --push-build-closure

  # test-configurations has a matrix strategy, so GitHub reports each leg under
  # a name like "Test Nix Configurations (macbook-m4-pro, ...)" — never the bare
  # "Test Nix Configurations". This job has a fixed name and gates on every leg,
  # so branch rules can require *it*. A skipped matrix (push to main) passes.
  test-configurations-status:
    name: Test Nix Configurations
    needs: [test-configurations]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check matrix result
        run: |
          result="${{ needs.test-configurations.result }}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "One or more configurations failed: $result"
            exit 1
          fi
