name: nix-setup
description: Nix, Magic Nix Cache, Cachix and the sops age key

inputs:
  cachix-token:
    description: CACHIX_AUTH_TOKEN for the frostplexx cache
    required: false
    default: ""
  sops-age-key:
    description: SOPS_AGE_KEY; skipped when empty
    required: false
    default: ""
  push:
    description: Push build results to Cachix
    required: false
    default: "true"
  magic-cache:
    description: Start the Magic Nix Cache daemon (needs id-token write)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v23
      with:
        extra-conf: |
          extra-experimental-features = nix-command flakes external-builders
          substituters = https://cache.nixos.org https://frostplexx.cachix.org https://nvf.cachix.org https://nix-community.cachix.org https://vicinae.cachix.org https://cache.thalheim.io
          trusted-substituters = https://cache.nixos.org https://frostplexx.cachix.org https://nvf.cachix.org https://nix-community.cachix.org https://vicinae.cachix.org https://cache.thalheim.io
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= frostplexx.cachix.org-1:kjkhnGNSkUvf5Mx8OEfhzaR830CUkDRglaKduAcr3UQ= nvf.cachix.org-1:GMQWiUhZ6ux9D5CvFFMwnc2nFrUHTeGaXRlVBXo+naI= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= vicinae.cachix.org-1:1kDrfienkGHPYbkpNj1mWTr7Fm1+zcenzgTizIcI3oc= cache.thalheim.io-1:R7msbosLEZKrxk/lKxf9BTjOOH7Ax3H0Qj0/6wiHOgc= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=

    - name: Start the Magic Nix Cache
      if: inputs.magic-cache == 'true'
      uses: DeterminateSystems/magic-nix-cache-action@v15
      with:
        use-flakehub: "false"

    - name: Connect Cachix
      if: inputs.cachix-token != ''
      uses: cachix/cachix-action@v17
      with:
        name: frostplexx
        authToken: ${{ inputs.cachix-token }}
        push: ${{ inputs.push == 'true' }}

    - name: Write the sops age key
      if: inputs.sops-age-key != ''
      shell: bash
      env:
        SOPS_AGE_KEY: ${{ inputs.sops-age-key }}
      run: |
        mkdir -p "$HOME/.config/sops/age"
        printf '%s\n' "$SOPS_AGE_KEY" > "$HOME/.config/sops/age/keys.txt"
        chmod 600 "$HOME/.config/sops/age/keys.txt"
